# WarpBro builds through cuda-oxide (`cargo oxide …`): its kernels are Rust compiled to PTX by the
# rustc_codegen_cuda backend. Plain `cargo build` / `cargo run` cannot (build.rs explains why).
# Built-in `cargo b` / `cargo r` cannot be overridden, hence the `o` prefix.
[alias]
ob = "oxide build"
or = "oxide run"
ogallery = "oxide run -- --gallery"
obench = "oxide run -- --bench"

[net]
git-fetch-with-cli = true

[env]
# cuda-oxide uses compiler-internal APIs with the stable toolchain.
RUSTC_BOOTSTRAP = "1"
CUDA_OXIDE_PTX_DIR = { value = "target/oxide-ptx", relative = true }
