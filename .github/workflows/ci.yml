name: CI and release

# Hosted runners have no GPU: they check, lint, run every test not named cuda_* / gpu_* (see
# src/test_gpu.rs), build the release for sm_75 and package it. CUDA tests stay local
# (python bootstrap.py b; cargo oxide test). A v* tag also publishes the archives.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  PYTHONUTF8: '1'
  # Private ssh:// git dependencies are fetched by the git CLI through the rewrite below.
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  # cuda-oxide needs llc >= 21 (bootstrap.py MIN_LLVM).
  LLVM_VERSION: '21.1.8'

jobs:
  build:
    name: ${{ matrix.platform }}
    # A pull request from a fork gets no secrets, so it cannot fetch the private
    # dependencies: skip it instead of failing on the missing DEPS_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
          - platform: linux-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Read access to private ssoj13 dependencies
        shell: bash
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          test -n "$DEPS_TOKEN" || { echo "::error::DEPS_TOKEN secret is missing"; exit 1; }
          # Both SSH spellings: Cargo.toml uses ssh://, git submodules (kvz-rs) use scp-style.
          base="https://x-access-token:${DEPS_TOKEN}@github.com/"
          git config --global url."$base".insteadOf "ssh://git@github.com/"
          git config --global --add url."$base".insteadOf "git@github.com:"

      # The full CUDA toolkit does not fit beside the image's preinstalled SDKs on the
      # Ubuntu runner's root disk; drop the ones this build never uses.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Install CUDA toolkit
        id: cuda
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.3.1'
          method: network
          log-file-suffix: ${{ matrix.platform }}.txt

      # cuda-oxide needs `llc`, which the Windows LLVM installer omits: the full
      # clang+llvm archive has it. Only what the build runs is kept (llc, opt and
      # llvm-link for cuda-oxide; clang and libclang with its headers for bindgen), so the
      # cache stays small beside the two Rust target caches in the 10 GB repo limit.
      - name: Cache LLVM (Windows)
        if: runner.os == 'Windows'
        id: llvm-cache
        uses: actions/cache@v6.1.0
        with:
          path: C:\llvm
          key: llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc-tools

      - name: Install LLVM (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          name="clang+llvm-${LLVM_VERSION}-x86_64-pc-windows-msvc"
          curl -fsSL -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${name}.tar.xz"
          7z x llvm.tar.xz -so | 7z x -si -ttar -oC:/llvm-extract > /dev/null
          src="/c/llvm-extract/${name}"
          mkdir -p /c/llvm/bin /c/llvm/lib
          for tool in llc.exe opt.exe llvm-link.exe clang.exe libclang.dll; do
            cp "$src/bin/$tool" /c/llvm/bin/
          done
          cp -r "$src/lib/clang" /c/llvm/lib/
          rm -rf llvm.tar.xz /c/llvm-extract
          du -sh /c/llvm

      - name: Install LLVM and system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          major="${LLVM_VERSION%%.*}"
          curl -fsSL https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh "$major"
          sudo apt-get install --no-install-recommends -y "libclang-${major}-dev" pkg-config \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libudev-dev libasound2-dev libvulkan-dev

      - name: Point the build at the toolkits
        shell: bash
        run: |
          echo "CUDA_HOME=${{ steps.cuda.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"
          echo "CUDA_TOOLKIT_PATH=${{ steps.cuda.outputs.CUDA_PATH }}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo 'C:\llvm\bin' >> "$GITHUB_PATH"
            echo 'CUDA_OXIDE_LLC=C:\llvm\bin\llc.exe' >> "$GITHUB_ENV"
            echo 'LIBCLANG_PATH=C:\llvm\bin' >> "$GITHUB_ENV"
          else
            major="${LLVM_VERSION%%.*}"
            echo "CUDA_OXIDE_LLC=/usr/bin/llc-${major}" >> "$GITHUB_ENV"
            echo "LIBCLANG_PATH=/usr/lib/llvm-${major}/lib" >> "$GITHUB_ENV"
            echo "/usr/lib/llvm-${major}/bin" >> "$GITHUB_PATH"
          fi

      # Every crate's fingerprint includes the codegen backend's identity, so a new
      # cuda-oxide revision recompiles the whole graph. Keying the cache on the revision
      # starts a fresh cache instead of restoring the old one and saving both
      # generations of artifacts together.
      - name: cuda-oxide revision
        id: oxide
        shell: bash
        run: |
          rev=$(sed -n 's/^CUDA_OXIDE_REV = "\([0-9a-f]*\)"/\1/p' bootstrap.py)
          test -n "$rev"
          echo "rev=${rev:0:12}" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v0-rust-oxide-${{ steps.oxide.outputs.rev }}
          key: ${{ matrix.platform }}
          # Keep what compiled even when a later stage (tests, packaging) fails.
          cache-on-failure: true
          # cargo-oxide builds and caches the codegen backend here.
          cache-directories: ~/.cargo/cuda-oxide

      - name: Toolchain, check, tests without a GPU, release build and archive
        run: python bootstrap.py ci

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release archives
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '*'
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for platform in windows-x86_64 linux-x86_64; do
            test -f "release/warpbro-${TAG}-${platform}.zip"
          done
          shopt -s nullglob
          archives=(release/*.zip)
          test "${#archives[@]}" -eq 2
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --generate-notes \
              --title "$TAG" "${prerelease[@]}"
          fi
          gh release upload "$TAG" "${archives[@]}" --clobber
          gh release edit "$TAG" --draft=false "${prerelease[@]}"
