[package]
name = "warpbro"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "WarpBro"
path = "src/main.rs"

[workspace]
members = ["crates/fractal-materials"]

[dependencies]
fractal-materials = { path = "crates/fractal-materials" }
playa-player = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413", default-features = false }
pt-denoise-oidn = { git = "ssh://git@github.com/ssoj13/squarebob-rs.git", rev = "3dedf872cddb06b4aa5689f5cfe022468cdb6f3b" }
render-core = { git = "ssh://git@github.com/ssoj13/squarebob-rs.git", rev = "3dedf872cddb06b4aa5689f5cfe022468cdb6f3b" }
# Share the wrapper's branch source; Cargo.lock pins its exact commit.
oidn-rs = { git = "ssh://git@github.com/ssoj13/oidn-rs.git", branch = "main" }
playa-graph = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413" }
playa-engine = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413", default-features = false }
playa-time = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413" }
playa-coord = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413" }
playa-events = { git = "ssh://git@github.com/ssoj13/playa.git", rev = "00d90428d6c931b69b7117fd2a4cdf143d075413" }
egui-outliner = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
# Our Windows fork includes the Rust 1.99 backend fixes.
cuda-device = { git = "ssh://git@github.com/ssoj13/cuda-oxide-windows.git", rev = "f3f1098a776a630d8003f2229934e0563cdec252" }
cuda-host = { git = "ssh://git@github.com/ssoj13/cuda-oxide-windows.git", rev = "f3f1098a776a630d8003f2229934e0563cdec252" }
# Match cuda-host's Windows-compatible runtime to keep shared types identical.
cuda-core = { git = "ssh://git@github.com/ansidium/cutile-rs.git", rev = "b4eae9b2a783eba8e18587aa2b760f985a07f866" }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui-dock-layout = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-viewport-toolbar = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-wgpu = "0.36"
egui-winit = "0.36"
wgpu = "30"
winit = "0.30"
bytemuck = "1"
anyhow = "1"
vfx-ocio = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main", features = ["gpu", "parallel"] }
egui-display = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-hdr-view = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
gpu-info = { package = "gpu-info-rs", git = "ssh://git@github.com/ssoj13/gpu-info-rs.git", branch = "main", default-features = false, features = ["wgpu"] }
exr = "1.74"
egui-encode-dialog = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-layout-manager = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
av-codec = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main", default-features = false, features = ["enc-hevc", "hwaccel-vulkan"] }
av-hwaccel-vulkan = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main", features = ["vulkan"] }
av-codec-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-format-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-format-movenc = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-swscale = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-frame = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-pixfmt = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }

standard-surface-bsdf = { git = "ssh://git@github.com/ssoj13/render-rs.git", rev = "cd72eb3ac4ad28b7b31c78826f192f383f4b6989", features = ["cuda-math"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
png = "0.18.1"
dirs = "7.0.0"
cam-controls = { git = "ssh://git@github.com/ssoj13/gitnexus-rs.git", rev = "268bcfc8f31d291aefd0e67e2358a6d1e69b39cd", features = ["inertial-look"] }
glam = "0.33.6"
cam-viewport = { git = "ssh://git@github.com/ssoj13/gitnexus-rs.git", rev = "268bcfc8f31d291aefd0e67e2358a6d1e69b39cd" }

log = "0.4"
rayon = "1"
egui-file-dialog = { git = "ssh://git@github.com/ssoj13/egui-file-dialog.git", rev = "865964380b02525bcf4c7d145e37f820b72486fc" }
egui-file-field = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-prefs2 = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-phosphor = { git = "ssh://git@github.com/ssoj13/egui-phosphor.git", branch = "main" }

env_logger = "0.11"

egui-attr-grid = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-attr-table = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-titlebar = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-statusbar = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-widgets-config = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
egui-track-timeline = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", rev = "ccbf54e720114e11c1f4b7cf4c8df90b1e680918" }
curves = { git = "ssh://git@github.com/ssoj13/curves-rs.git", branch = "main", features = ["serde"] }
box-rs = { git = "ssh://git@github.com/ssoj13/box-rs.git", branch = "main" }
image = { version = "0.25", default-features = false, features = ["hdr", "exr"] }

[dev-dependencies]
av-format-mov = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }

# Keep transitive Git dependencies on the same pinned SSH sources.

