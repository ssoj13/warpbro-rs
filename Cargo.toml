[package]
name = "frac-rs"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
# Our Windows fork includes the Rust 1.99 backend fixes.
cuda-device = { git = "ssh://git@github.com/ssoj13/cuda-oxide-windows.git", rev = "f3f1098a776a630d8003f2229934e0563cdec252" }
cuda-host = { git = "ssh://git@github.com/ssoj13/cuda-oxide-windows.git", rev = "f3f1098a776a630d8003f2229934e0563cdec252" }
# Match cuda-host's Windows-compatible runtime to keep shared types identical.
cuda-core = { git = "https://github.com/ansidium/cutile-rs", rev = "b4eae9b2a783eba8e18587aa2b760f985a07f866" }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui-dock-layout = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-viewport-toolbar = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-wgpu = "0.36"
egui-winit = "0.36"
wgpu = "30"
winit = "0.30"
bytemuck = "1"
anyhow = "1"
vfx-ocio = { git = "ssh://git@github.com/ssoj13/oiio-rs.git", branch = "main", features = ["gpu", "parallel"] }
egui-display = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-hdr-view = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
gpu-info = { package = "gpu-info-rs", git = "ssh://git@github.com/ssoj13/gpu-info-rs.git", branch = "main", default-features = false, features = ["wgpu"] }
exr = "1.74"
egui-encode-dialog = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-layout-manager = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
av-codec = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main", default-features = false, features = ["enc-hevc"] }
av-codec-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-format-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-format-movenc = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-swscale = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-core = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-frame = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }
av-util-pixfmt = { git = "ssh://git@github.com/ssoj13/ffmpeg-rs.git", branch = "main" }

standard-surface-bsdf = { version = "0.1.0", path = "vendor/standard-surface-bsdf" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
png = "0.18.1"
dirs = "7.0.0"
cam-controls = { version = "0.1.0", path = "vendor/cam-controls" }
glam = "0.33.6"
cam-viewport = { version = "0.1.0", path = "vendor/cam-viewport" }

log = "0.4"
rayon = "1"
egui-file-dialog = "0.15"
egui-prefs2 = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-phosphor = { git = "ssh://git@github.com/ssoj13/egui-phosphor.git", branch = "main" }

env_logger = "0.11"

egui-attr-grid = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-attr-table = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
egui-titlebar = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
