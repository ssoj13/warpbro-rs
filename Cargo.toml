[package]
name = "warpbro"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "WarpBro"
path = "src/main.rs"

[features]
default = []

[dependencies]
soluwell-studio = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
animation = { git = "ssh://git@github.com/ssoj13/animation-rs.git", branch = "main" }
# The fractal path tracer shared with ofx-rs: parameter ABI and sampling, and the CUDA kernels
# (built into this binary through #[cuda_module]).
fractal-core = { git = "ssh://git@github.com/ssoj13/fractal-rs.git", branch = "main" }
# `direct`: the Direct display's deterministic shading kernels (`world_direct`, `direct_<family>`).
fractal-kernels = { git = "ssh://git@github.com/ssoj13/fractal-rs.git", branch = "main", features = ["direct"] }
# Our Windows fork includes the Rust 1.99 backend fixes.
cuda-device = { git = "ssh://git@github.com/ssoj13/cuda-rust-windows.git", branch = "main" }
cuda-host = { git = "ssh://git@github.com/ssoj13/cuda-rust-windows.git", branch = "main" }
# The monorepo ships cuda-core next to cuda-host; one source keeps a single cuda-core in the graph.
cuda-core = { git = "ssh://git@github.com/ssoj13/cuda-rust-windows.git", branch = "main" }
curves = { git = "ssh://git@github.com/ssoj13/curves-rs.git", branch = "main", features = ["serde"] }
egui = "0.36"
soluwell-config = { git = "ssh://git@github.com/ssoj13/egui-widgets-rs.git", branch = "main" }
glam = "0.33.6"
log = "0.4"
anyhow = "1"
env_logger = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
crashdump = { package = "crashdump-rs", git = "ssh://git@github.com/ssoj13/crashdump-rs.git", branch = "main" }

[dev-dependencies]
standard-surface-bsdf = { git = "ssh://git@github.com/ssoj13/render-rs.git", branch = "main", features = ["cuda-math"] }
gpu-info = { package = "gpu-info-rs", git = "ssh://git@github.com/ssoj13/gpu-info-rs.git", branch = "main", default-features = false, features = ["wgpu"] }
wgpu = "30"
